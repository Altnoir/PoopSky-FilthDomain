plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // 前置 PoopSky 的本地发布仓库：先在 ../PoopSkyMod 下执行 ./gradlew publish
    maven { url = file("../PoopSkyMod/repo") }
    maven {
        name = "RingLoReleases"
        url = "https://maven.ringlo.im/releases"
        content {
            includeGroup "com.altnoir"
        }
    }
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate（AbyssLib POM 传递、编译期可见同款）
    maven { url = "https://api.modrinth.com/maven" } // Simple Bedrock Model
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Player####'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // transitive=false：不解析前置 POM 中的运行时依赖（Create、车万女仆等由前置自行管理）。
    // implementation 不会被打包进附属的 jar，运行游戏时前置由玩家单独安装。
    implementation("com.altnoir.poopsky:PoopSkyMod:${poopsky_version}") {
        transitive = false
    }
    // 坐标形如 com.altnoir:abysslib-<MC 版本>:<版本>：artifactId 里的 MC 版本是必须的，
    // 因为 AbyssLib 的 26.1 线用的是同一个 group 和同一个 mod_version，不区分就会互相覆盖。
    implementation("com.altnoir:abysslib-${minecraft_version}:${abysslib_version}")
    // 咒蛙渲染器（基岩模型 + 动画混合）所需库；运行时由前置 PoopSky 的 jarJar 提供。
    compileOnly("com.github.mcmodderanchor:simplebedrockmodel:${sbm_version}-neoforge-mc1.21.1") {
        version {
            prefer "$sbm_version"
        }
    }
    compileOnly("com.maydaymemory:mae:${mae_version}") {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // 模板过滤统一使用 UTF-8（expand 读写）
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            poopsky_version_range  : poopsky_version_range,
            abysslib_version_range : abysslib_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 允许将本模组发布到本地仓库，供其他附属项目使用（可选）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
